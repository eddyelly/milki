openapi: 3.1.0
info:
  title: Milki API
  version: 0.8.0
  description: |
    Decentralized land transfer system on Hyperledger Fabric (Ministry of Lands, Tanzania).

    **Conventions**
    - Success envelope: `{ "data": ..., "meta": ... }`. Error envelope: `{ "error": { "code", "message", "details" } }`.
      `message` is human-readable and safe to show to users.
    - Every write sends an `Idempotency-Key` header (8–128 URL-safe chars). A repeat of a completed request is
      replayed with `Idempotent-Replayed: true` instead of executing again.
    - **Ledger writes** (T3) also need `X-Reauth-Token` from `POST /auth/reauth` (single use, 5 minutes) and return
      `202 { txId, status: "SUBMITTED" }`. The commit arrives on Socket.IO as `ledger:tx`
      (`{ txId, status: COMMITTED|FAILED, blockNumber }`); `GET /ledger/tx/{txId}` is the polling fallback.
    - Socket.IO events: `ledger:tx` (your commit), `ledger:event` (anything touching you), `notification` (new inbox item),
      `queue:updated` (staff work queues).
    - `meta.source` says where data came from: `ledger` (authoritative) or `cache` (lists/search).
servers:
  - url: http://localhost:4100/api/v1
tags:
  - name: Auth
  - name: Parcels
  - name: Transfers
  - name: Documents
  - name: Notifications
  - name: Users
  - name: Disputes
  - name: Stats
  - name: Ledger
  - name: Health
  - name: Verify
  - name: Help centre
  - name: Support
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    ReauthToken:
      name: X-Reauth-Token
      in: header
      required: true
      description: From `POST /auth/reauth`. Single use, valid 5 minutes.
      schema: { type: string }
    TransferId:
      name: transferId
      in: path
      required: true
      schema: { type: string, example: TRF-0A1B2C3D4E5F6789 }
    DocumentId:
      name: documentId
      in: path
      required: true
      schema: { type: string, example: DOC-0A1B2C3D4E5F6789 }
    ParcelId:
      name: parcelId
      in: path
      required: true
      schema: { type: string, example: DSM-KIN-12-45 }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: PARCEL_ENCUMBERED }
            message: { type: string, example: This parcel has an active mortgage with CRDB Bank. It must be released before the parcel can be transferred. }
            details: {}
    Submitted:
      type: object
      properties:
        data:
          type: object
          properties:
            txId: { type: string }
            status: { type: string, enum: [SUBMITTED] }
            parcelId: { type: string }
        meta: { type: 'null' }
    OtpChallenge:
      type: object
      properties:
        challengeId: { type: string }
        sentTo: { type: string, example: '+255•••••001' }
        expiresIn: { type: integer, example: 300 }
        purpose: { type: string, enum: [REGISTER, LOGIN] }
    User:
      type: object
      properties:
        userId: { type: string, example: usr_6650c1f2a9e4b1c2d3e4f5a6 }
        role: { type: string, enum: [CITIZEN, LAND_OFFICER, REGISTRAR, BANK_OFFICER, SUPPORT_AGENT, SYSTEM_ADMIN] }
        fullName: { type: string }
        email: { type: [string, 'null'] }
        phone: { type: string }
        nidaMasked: { type: [string, 'null'] }
        status: { type: string, enum: [PENDING_VERIFICATION, ACTIVE, DEACTIVATED] }
        ledgerIdentity:
          type: object
          properties:
            enrolled: { type: boolean }
            mspId: { type: [string, 'null'] }
    Session:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string }
        refreshToken: { type: string, description: Also set as httpOnly cookie `milki_rt` for the web portal. }
        accessExpiresIn: { type: string, example: 15m }
    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude: { type: number }
        longitude: { type: number }
        boundary: { type: array, items: { type: array, items: { type: number }, minItems: 2, maxItems: 2 } }
        address: { type: string }
    Parcel:
      type: object
      properties:
        parcelId: { type: string }
        titleNumber: { type: string }
        region: { type: string }
        district: { type: string }
        ward: { type: string }
        area: { type: number, description: Square metres }
        landUse: { type: string, enum: [RESIDENTIAL, COMMERCIAL, AGRICULTURAL, INDUSTRIAL, INSTITUTIONAL, MIXED_USE] }
        location: { $ref: '#/components/schemas/Location' }
        status: { type: string, enum: [ACTIVE, PENDING_TRANSFER, ENCUMBERED, DISPUTED, FROZEN, RETIRED] }
        owner:
          type: object
          properties:
            userId: { type: string }
            fullName: { type: string, description: Officials only }
        ownershipVersion: { type: integer }
        activeTransferId: { type: [string, 'null'] }
        updatedAt: { type: string, format: date-time }
        lastTxId: { type: string }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Submitted:
      description: Submitted to the ledger; commit status follows over Socket.IO.
      content: { application/json: { schema: { $ref: '#/components/schemas/Submitted' } } }

paths:
  /health:
    get:
      tags: [Health]
      summary: Dependency health (MongoDB, Redis, ledger)
      responses: { '200': { description: OK }, '503': { description: Degraded } }

  /auth/register:
    post:
      tags: [Auth]
      summary: Citizen self-registration (sends a phone OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, phone, nida, password]
              properties:
                fullName: { type: string }
                phone: { type: string, example: '0712 345 678' }
                email: { type: string }
                nida: { type: string, example: 19900101-12345-00001-01 }
                password: { type: string, minLength: 8 }
                preferredLanguage: { type: string, enum: [en, sw] }
      responses:
        '201':
          description: Account created, OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId: { type: string }
                      challenge: { $ref: '#/components/schemas/OtpChallenge' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Password step of sign-in (sends an OTP)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, password]
              properties:
                identifier: { type: string, description: Phone number or email }
                password: { type: string }
      responses:
        '200': { description: OTP sent, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OtpChallenge' } } } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /auth/otp/verify:
    post:
      tags: [Auth]
      summary: Confirm a REGISTER or LOGIN code and start a session
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [challengeId, code], properties: { challengeId: { type: string }, code: { type: string, pattern: '^\d{6}$' } } } } }
      responses:
        '200': { description: Session, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Session' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/otp/resend:
    post:
      tags: [Auth]
      summary: Send a fresh code (the old challenge stops working)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [challengeId], properties: { challengeId: { type: string } } } } } }
      responses: { '200': { description: New challenge }, '400': { $ref: '#/components/responses/Error' } }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate tokens (refresh token from body or the `milki_rt` cookie; each works once)
      requestBody: { content: { application/json: { schema: { type: object, properties: { refreshToken: { type: string } } } } } }
      responses: { '200': { description: New session }, '401': { $ref: '#/components/responses/Error' } }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the refresh token
      responses: { '200': { description: Signed out } }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearer: [] }]
      summary: Current user
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/User' } } } } } } }
  /auth/reauth/otp:
    post:
      tags: [Auth]
      security: [{ bearer: [] }]
      summary: Send a REAUTH code for a T3 confirmation
      responses: { '200': { description: Challenge } }
  /auth/reauth:
    post:
      tags: [Auth]
      security: [{ bearer: [] }]
      summary: Re-authenticate for a ledger write (password, OTP or biometric-unlocked device secret) → single-use reauth token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [password], properties: { password: { type: string } } }
                - { type: object, required: [challengeId, code], properties: { challengeId: { type: string }, code: { type: string } } }
                - { type: object, required: [deviceId, deviceSecret], description: Mobile, after a local biometric/PIN check, properties: { deviceId: { type: string }, deviceSecret: { type: string } } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { reauthToken: { type: string }, expiresIn: { type: integer } } } } } } } }
        '401': { $ref: '#/components/responses/Error' }

  /auth/reauth/device:
    post:
      tags: [Auth]
      security: [{ bearer: [] }]
      summary: Link this phone for biometric confirmation (proves the password once) → device secret, shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, password]
              properties:
                deviceId: { type: string, pattern: '^[A-Za-z0-9_-]{8,64}$' }
                deviceName: { type: string, maxLength: 80 }
                password: { type: string }
      responses:
        '200': { description: 'data = { deviceId, deviceSecret }. The secret is stored only hashed on the server and in the phone''s Keystore/Keychain.' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/reauth/device/{deviceId}:
    delete:
      tags: [Auth]
      security: [{ bearer: [] }]
      summary: Unlink this phone (turn off biometric confirmation; also done on sign-out)
      parameters: [{ name: deviceId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }

  /verify/parcels/{parcelId}:
    get:
      tags: [Verify]
      summary: Public QR verification of a parcel, read from the ledger (no sign-in, 60/min per IP)
      parameters: [{ name: parcelId, in: path, required: true, schema: { type: string } }]
      responses:
        '200': { description: 'data = { parcelId, titleNumber, region, district, ward, area, landUse, status, owner (short display name), ownershipVersion, encumbered, disputed, frozen, transferInProgress, lastTxId, updatedAt, verifiedAt }; meta.source = ledger' }
        '404': { $ref: '#/components/responses/Error' }
  /verify/documents/{documentId}:
    get:
      tags: [Verify]
      summary: Public hash check of a document against the ledger (the QR carries its ID and SHA-256)
      parameters:
        - { name: documentId, in: path, required: true, schema: { type: string, pattern: '^DOC-[A-F0-9]{16}$' } }
        - { name: sha256, in: query, required: true, schema: { type: string, pattern: '^[a-f0-9]{64}$' } }
      responses:
        '200': { description: 'data = { documentId, match, status, version, latestDocumentId, parcelId, documentType, sha256, verifiedAt }' }
        '404': { $ref: '#/components/responses/Error' }

  /kb/categories:
    get: { tags: [Help centre], summary: 'Categories with published article counts (public)', responses: { '200': { description: OK } } }
    post: { tags: [Help centre], security: [{ bearer: [] }], parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], summary: 'Create a category (SUPPORT_AGENT, SYSTEM_ADMIN; T1). Body: slug, name (en/sw), icon, order', responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } } }
  /kb/categories/{id}:
    patch: { tags: [Help centre], security: [{ bearer: [] }], summary: 'Update a category (T1)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
    delete: { tags: [Help centre], security: [{ bearer: [] }], summary: 'Soft-delete an empty category (T2; 409 CATEGORY_NOT_EMPTY)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /kb/articles:
    get:
      tags: [Help centre]
      summary: 'Search articles (public: published only; editors may pass status=DRAFT|ALL)'
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Full-text in English and Swahili }
        - { name: category, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [PUBLISHED, DRAFT, ALL] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { description: 'Articles: slug, categorySlug, title (en/sw), body (en/sw), tags, status, helpfulYes, helpfulNo, views' } }
    post: { tags: [Help centre], security: [{ bearer: [] }], parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], summary: 'Create an article (T1). Body: slug, categorySlug, title (en/sw), body (en/sw), tags, status', responses: { '201': { description: Created } } }
  /kb/articles/{slug}:
    get: { tags: [Help centre], summary: 'Read an article (counts a view)', parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
  /kb/articles/{slug}/vote:
    post: { tags: [Help centre], summary: '"Was this helpful?" — one vote per reader (user, or hashed IP when signed out). Body: helpful (boolean)', parameters: [{ name: slug, in: path, required: true, schema: { type: string } }], responses: { '200': { description: 'helpful, helpfulYes, helpfulNo' } } }
  /kb/articles/{id}:
    patch: { tags: [Help centre], security: [{ bearer: [] }], summary: 'Update / publish / unpublish an article (T1; unpublish is T2 in the UI)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
    delete: { tags: [Help centre], security: [{ bearer: [] }], summary: 'Soft-delete an article (T2)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /tickets:
    get:
      tags: [Support]
      security: [{ bearer: [] }]
      summary: 'List tickets. Users see their own; SUPPORT_AGENT / SYSTEM_ADMIN see the queue.'
      parameters:
        - { name: status, in: query, schema: { type: string }, description: 'Comma-separated: OPEN, IN_PROGRESS, AWAITING_USER, RESOLVED, CLOSED' }
        - { name: priority, in: query, schema: { type: string }, description: 'Comma-separated: LOW, NORMAL, HIGH, URGENT' }
        - { name: category, in: query, schema: { type: string, enum: [GETTING_STARTED, TRANSFERS, DOCUMENTS, MORTGAGES, ACCOUNT, OTHER] } }
        - { name: assignee, in: query, schema: { type: string }, description: 'me | unassigned | userId (staff)' }
        - { name: tag, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string }, description: 'Ticket number, subject, parcel or transfer ID' }
        - { name: sort, in: query, schema: { type: string, enum: ['-updatedAt', updatedAt, '-createdAt', createdAt, sla, priority, '-lastMessageAt'] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { description: 'Tickets with sla (target, dueAt, state OK|WARNING|BREACHED|MET, elapsed), requester, assignee' } }
    post:
      tags: [Support]
      security: [{ bearer: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      summary: 'Open a ticket (T1). JSON or multipart (optional file: PDF/JPEG/PNG up to 10 MB). Numbers look like MLK-000123.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [category, subject, description]
              properties:
                category: { type: string, enum: [GETTING_STARTED, TRANSFERS, DOCUMENTS, MORTGAGES, ACCOUNT, OTHER] }
                priority: { type: string, enum: [LOW, NORMAL, HIGH, URGENT], default: NORMAL }
                subject: { type: string, maxLength: 140 }
                description: { type: string, maxLength: 5000 }
                parcelId: { type: string, description: 'From a "Get help" button; citizens may only link their own' }
                transferId: { type: string }
      responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Error' } }
  /tickets/{id}:
    get: { tags: [Support], security: [{ bearer: [] }], summary: Ticket detail, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Support], security: [{ bearer: [] }], summary: 'Staff: status, priority, assigneeId, tags (T1). Invalid transitions return 409 INVALID_STATE', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
    delete: { tags: [Support], security: [{ bearer: [] }], summary: 'SYSTEM_ADMIN soft delete (T2)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /tickets/{id}/claim:
    post: { tags: [Support], security: [{ bearer: [] }], summary: 'Staff: assign to yourself (409 ALREADY_ASSIGNED if someone else has it)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /tickets/{id}/close:
    post: { tags: [Support], security: [{ bearer: [] }], summary: 'Requester or staff closes (T2)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /tickets/{id}/reopen:
    post: { tags: [Support], security: [{ bearer: [] }], summary: 'Requester reopens within 7 days of resolution (409 REOPEN_WINDOW_PASSED)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /tickets/{id}/rating:
    post: { tags: [Support], security: [{ bearer: [] }], summary: 'CSAT: stars 1–5 and optional comment, once resolved', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /tickets/{id}/context:
    get: { tags: [Support], security: [{ bearer: [] }], summary: 'Staff, read-only: requester profile, parcels, transfers (cache) and previous tickets', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: 'meta.readOnly = true' } } }
  /tickets/{id}/escalate:
    post: { tags: [Support], security: [{ bearer: [] }], summary: 'Staff: create an internal task for LAND_OFFICER. Body: note', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } } }
  /tickets/{id}/messages:
    get: { tags: [Support], security: [{ bearer: [] }], summary: 'Messages (internal notes only for staff)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
    post: { tags: [Support], security: [{ bearer: [] }], summary: 'Send a message, or an internal note (staff). JSON (body, internal) or multipart with file. Fanned out on /support; offline requesters get push + email.', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '201': { description: Created }, '409': { $ref: '#/components/responses/Error' } } }
  /tickets/{id}/messages/{messageId}:
    patch: { tags: [Support], security: [{ bearer: [] }], summary: 'Edit your own message within 5 minutes (409 EDIT_WINDOW_PASSED)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: messageId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
    delete: { tags: [Support], security: [{ bearer: [] }], summary: 'Delete your own message within 5 minutes (soft)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: messageId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /tickets/{id}/read:
    post: { tags: [Support], security: [{ bearer: [] }], summary: 'Read receipt (UI state; no confirmation). Emits read on /support.', parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: OK } } }
  /tickets/{id}/attachments/{sha}:
    get: { tags: [Support], security: [{ bearer: [] }], summary: Download an attachment, parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { name: sha, in: path, required: true, schema: { type: string } }], responses: { '200': { description: File } } }
  /support/presence:
    get: { tags: [Support], security: [{ bearer: [] }], summary: 'How many agents are online (live chat)', responses: { '200': { description: agentsOnline } } }
  /support/agents:
    get: { tags: [Support], security: [{ bearer: [] }], summary: 'Staff: assignable agents', responses: { '200': { description: OK } } }
  /support/canned:
    get: { tags: [Support], security: [{ bearer: [] }], summary: 'Staff: canned responses (q filter)', responses: { '200': { description: OK } } }
    post: { tags: [Support], security: [{ bearer: [] }], parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }], summary: 'Staff: create (title, body, tags) — T1', responses: { '201': { description: Created } } }
  /support/canned/{id}:
    patch: { tags: [Support], security: [{ bearer: [] }], summary: Update (T1), parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
    delete: { tags: [Support], security: [{ bearer: [] }], summary: Soft delete (T2), parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /support/escalations:
    get: { tags: [Support], security: [{ bearer: [] }], summary: 'LAND_OFFICER, REGISTRAR and staff: escalations (status OPEN|DONE|ALL)', responses: { '200': { description: OK } } }
  /support/escalations/{id}/done:
    post: { tags: [Support], security: [{ bearer: [] }], summary: 'LAND_OFFICER / REGISTRAR answers with a resolution (added as an internal note)', parameters: [{ name: id, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }], responses: { '200': { description: OK } } }
  /support/metrics:
    get: { tags: [Support], security: [{ bearer: [] }], summary: 'Open tickets, SLA breaches, average first response / resolution, CSAT trend, tickets by category (days=30)', responses: { '200': { description: OK } } }
  /parcels:
    get:
      tags: [Parcels]
      security: [{ bearer: [] }]
      summary: List parcels (cache). Citizens see only their own.
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: q, in: query, schema: { type: string }, description: Search parcel ID, title, region, district, ward }
        - { name: status, in: query, schema: { type: string }, description: 'Comma-separated, e.g. ACTIVE,ENCUMBERED' }
        - { name: region, in: query, schema: { type: string } }
        - { name: district, in: query, schema: { type: string } }
        - { name: landUse, in: query, schema: { type: string } }
        - { name: ownerId, in: query, schema: { type: string }, description: Officials only }
        - { name: sort, in: query, schema: { type: string, enum: [updatedAt, -updatedAt, parcelId, -parcelId, area, -area, createdAt, -createdAt] } }
      responses: { '200': { description: 'Page of parcels; meta = { page, limit, total, pages, source: cache }' } }
    post:
      tags: [Parcels]
      security: [{ bearer: [] }]
      summary: Register a parcel (REGISTRAR, T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parcelId, titleNumber, region, district, ward, blockNumber, plotNumber, area, landUse, location, owner]
              properties:
                parcelId: { type: string, example: DSM-KIN-12-45 }
                titleNumber: { type: string }
                region: { type: string }
                district: { type: string }
                ward: { type: string }
                blockNumber: { type: string }
                plotNumber: { type: string }
                area: { type: number }
                landUse: { type: string }
                location: { $ref: '#/components/schemas/Location' }
                owner:
                  oneOf:
                    - { type: object, required: [userId], properties: { userId: { type: string } } }
                    - { type: object, required: [nida], properties: { nida: { type: string } } }
      responses:
        '202': { $ref: '#/components/responses/Submitted' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /parcels/{parcelId}:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    get:
      tags: [Parcels]
      security: [{ bearer: [] }]
      summary: Parcel from the ledger
      responses: { '200': { description: OK, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Parcel' } } } } } }, '403': { $ref: '#/components/responses/Error' }, '404': { $ref: '#/components/responses/Error' } }
    patch:
      tags: [Parcels]
      security: [{ bearer: [] }]
      summary: Update land use, area (with reason) or location (REGISTRAR, T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                landUse: { type: string }
                area: { type: number }
                areaCorrectionReason: { type: string }
                location: { $ref: '#/components/schemas/Location' }
      responses: { '202': { $ref: '#/components/responses/Submitted' }, '400': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } }
  /parcels/{parcelId}/history:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    get:
      tags: [Parcels]
      security: [{ bearer: [] }]
      summary: Ownership/status history from the ledger (oldest first)
      responses: { '200': { description: OK } }
  /parcels/{parcelId}/encumbrances:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    get: { tags: [Parcels], security: [{ bearer: [] }], summary: Encumbrances (ledger), responses: { '200': { description: OK } } }
  /parcels/{parcelId}/disputes:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    get: { tags: [Parcels], security: [{ bearer: [] }], summary: Disputes (ledger), responses: { '200': { description: OK } } }
    post:
      tags: [Disputes]
      security: [{ bearer: [] }]
      summary: Flag a dispute (LAND_OFFICER, T3) — the parcel becomes DISPUTED and transfers stop
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, summary]
              properties:
                category: { type: string, enum: [OWNERSHIP, BOUNDARY, INHERITANCE, FRAUD, COURT_ORDER, OTHER] }
                summary: { type: string, minLength: 10, maxLength: 500, description: Stored on-chain — no personal data }
      responses: { '202': { description: 'Submitted: { txId, disputeId, parcelId }' }, '403': { $ref: '#/components/responses/Error' } }
  /parcels/{parcelId}/transfers:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    get: { tags: [Parcels], security: [{ bearer: [] }], summary: Transfers (ledger), responses: { '200': { description: OK } } }
  /parcels/{parcelId}/documents:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    get: { tags: [Parcels], security: [{ bearer: [] }], summary: Document references (ledger), responses: { '200': { description: OK } } }
  /parcels/{parcelId}/freeze:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    post:
      tags: [Parcels]
      security: [{ bearer: [] }]
      summary: Freeze (REGISTRAR, T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' }, '409': { $ref: '#/components/responses/Error' } }
  /parcels/{parcelId}/unfreeze:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    post:
      tags: [Parcels]
      security: [{ bearer: [] }]
      summary: Unfreeze (REGISTRAR, T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' }, '409': { $ref: '#/components/responses/Error' } }
  /parcels/{parcelId}/retire:
    parameters: [{ $ref: '#/components/parameters/ParcelId' }]
    post:
      tags: [Parcels]
      security: [{ bearer: [] }]
      summary: Retire — the record stays, status becomes RETIRED (REGISTRAR, T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' }, '409': { $ref: '#/components/responses/Error' } }

  /ledger/tx/{txId}:
    get:
      tags: [Ledger]
      security: [{ bearer: [] }]
      summary: Status of a submitted transaction (SUBMITTED / COMMITTED / FAILED)
      parameters: [{ name: txId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }

  /users/lookup:
    get:
      tags: [Users]
      security: [{ bearer: [] }]
      summary: Find an active landowner by phone or NIDA (CITIZEN, REGISTRAR, LAND_OFFICER) → userId + short display name
      parameters:
        - { name: phone, in: query, schema: { type: string } }
        - { name: nida, in: query, schema: { type: string } }
      responses: { '200': { description: '{ userId, displayName: "Juma H." }' }, '404': { $ref: '#/components/responses/Error' } }

  /transfers:
    get:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: List transfers (cache). Citizens see transfers they are part of; banks are refused.
      parameters:
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer, maximum: 100 } }
        - { name: q, in: query, schema: { type: string }, description: Transfer or parcel ID fragment }
        - { name: status, in: query, schema: { type: string }, description: Comma-separated statuses }
        - { name: parcelId, in: query, schema: { type: string } }
        - { name: role, in: query, schema: { type: string, enum: [seller, buyer, any] }, description: Citizens only }
        - { name: sort, in: query, schema: { type: string, enum: [updatedAt, -updatedAt, createdAt, -createdAt] } }
      responses: { '200': { description: Page of transfers } }
    post:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: Initiate a transfer (owner CITIZEN, T3). The sale price travels only in Fabric private data.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parcelId, buyer, salePrice]
              properties:
                parcelId: { type: string }
                buyer:
                  oneOf:
                    - { type: object, required: [userId], properties: { userId: { type: string } } }
                    - { type: object, required: [phone], properties: { phone: { type: string } } }
                    - { type: object, required: [nida], properties: { nida: { type: string } } }
                salePrice: { type: number }
                currency: { type: string, default: TZS }
      responses:
        '202': { description: 'Submitted: { txId, transferId, parcelId, status: SUBMITTED }' }
        '409': { $ref: '#/components/responses/Error' }
  /transfers/{transferId}:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    get:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: Transfer from the ledger, with both parties; `sale` (price) only for the parties, land officers and registrars
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' } }
  /transfers/{transferId}/documents:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    get: { tags: [Transfers], security: [{ bearer: [] }], summary: Documents attached to the transfer, responses: { '200': { description: OK } } }
  /transfers/{transferId}/accept:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    post:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: Buyer accepts (CITIZEN, T3) — INITIATED → BUYER_ACCEPTED
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      responses: { '202': { $ref: '#/components/responses/Submitted' }, '409': { $ref: '#/components/responses/Error' } }
  /transfers/{transferId}/confirm-payments:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    post:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: Land officer confirms payments using a receipt already attached to the transfer (LAND_OFFICER, T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [paymentReference, evidenceDocumentId], properties: { paymentReference: { type: string }, evidenceDocumentId: { type: string } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' }, '400': { $ref: '#/components/responses/Error' } }
  /transfers/{transferId}/verify:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    post:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: Officer verification (LAND_OFFICER, T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' } }
  /transfers/{transferId}/approve:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    post:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: Registrar approval — moves ownership; APPROVED → COMPLETED (REGISTRAR, T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { note: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' } }
  /transfers/{transferId}/cancel:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    post:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: Seller cancels before verification (CITIZEN, T2 confirmation in the UI + T3 re-auth)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' }, '409': { $ref: '#/components/responses/Error' } }
  /transfers/{transferId}/reject:
    parameters: [{ $ref: '#/components/parameters/TransferId' }]
    post:
      tags: [Transfers]
      security: [{ bearer: [] }]
      summary: Reject (LAND_OFFICER until verification, then REGISTRAR only; T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason], properties: { reason: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' }, '403': { $ref: '#/components/responses/Error' } }

  /documents:
    post:
      tags: [Documents]
      security: [{ bearer: [] }]
      summary: Upload a PDF/JPEG/PNG (≤10 MB) to MinIO and record its SHA-256 on-chain (T3)
      description: |
        Content type is checked by magic bytes. If `sha256` is sent, it must equal the server's hash of the received bytes
        (422 HASH_MISMATCH otherwise). If the ledger refuses the document, the stored object is removed.
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, targetType, targetId, documentType]
              properties:
                file: { type: string, format: binary }
                targetType: { type: string, enum: [PARCEL, TRANSFER] }
                targetId: { type: string }
                documentType: { type: string, enum: [TITLE_DEED, SALE_AGREEMENT, SURVEY_PLAN, ID_COPY, TAX_RECEIPT, PAYMENT_PROOF, VALUATION_REPORT, MORTGAGE_DEED, COURT_ORDER, OTHER] }
                sha256: { type: string }
      responses:
        '202': { description: 'Submitted: { txId, documentId, sha256, status: SUBMITTED }' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '422': { $ref: '#/components/responses/Error' }
  /documents/{documentId}/supersede:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    post:
      tags: [Documents]
      security: [{ bearer: [] }]
      summary: Upload a new version; the old hash stays on the ledger as SUPERSEDED (T3)
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary }, sha256: { type: string } } } } } }
      responses: { '202': { description: Submitted } }
  /documents/{documentId}/download:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    get:
      tags: [Documents]
      security: [{ bearer: [] }]
      summary: Download — bytes are re-hashed and checked against the ledger first (headers X-Ledger-Verified, X-Content-SHA256)
      responses: { '200': { description: The file }, '409': { description: INTEGRITY_FAILURE — stored file no longer matches the ledger } }
  /documents/{documentId}/verify:
    parameters: [{ $ref: '#/components/parameters/DocumentId' }]
    post:
      tags: [Documents]
      security: [{ bearer: [] }]
      summary: Check a file you hold against the ledger hash (no write)
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '200': { description: '{ match, status, version, latestDocumentId, sha256 }' } }

  /notifications:
    get:
      tags: [Notifications]
      security: [{ bearer: [] }]
      summary: My notifications (meta.unread = unread count)
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ['true', 'false'] } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: limit, in: query, schema: { type: integer } }
      responses: { '200': { description: OK } }
  /notifications/read-all:
    post: { tags: [Notifications], security: [{ bearer: [] }], summary: Mark all as read, responses: { '200': { description: OK } } }
  /notifications/{id}/read:
    post:
      tags: [Notifications]
      security: [{ bearer: [] }]
      summary: Mark one as read
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } }
  /notifications/{id}:
    delete:
      tags: [Notifications]
      security: [{ bearer: [] }]
      summary: Delete one
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }
  /devices:
    post:
      tags: [Notifications]
      security: [{ bearer: [] }]
      summary: Register / refresh this device's FCM token
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token, platform], properties: { token: { type: string }, platform: { type: string, enum: [android, ios, web] } } } } } }
      responses: { '200': { description: OK } }
  /devices/{token}:
    delete:
      tags: [Notifications]
      security: [{ bearer: [] }]
      summary: Remove this device's token (on sign-out)
      parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: OK } }

  /disputes/{disputeId}/notes:
    post:
      tags: [Disputes]
      security: [{ bearer: [] }]
      summary: Add a note (LAND_OFFICER or REGISTRAR, T3)
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' } }
  /disputes/{disputeId}/resolve:
    post:
      tags: [Disputes]
      security: [{ bearer: [] }]
      summary: Resolve (LAND_OFFICER or REGISTRAR, T3)
      parameters: [{ name: disputeId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }, { $ref: '#/components/parameters/ReauthToken' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [resolution], properties: { resolution: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Submitted' } }
  /stats/overview:
    get:
      tags: [Stats]
      security: [{ bearer: [] }]
      summary: Dashboard KPIs for staff (parcels/transfers by status, by region, last 6 months, work queues). Cached 60 s.
      responses: { '200': { description: OK }, '403': { $ref: '#/components/responses/Error' } }
